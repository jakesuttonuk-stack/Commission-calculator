<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Commission Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            color: white;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #e55a2b;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .tagline {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            opacity: 0.9;
        }
        .cta {
            margin-top: 15px;
            text-align: center;
        }
        .cta a {
            color: #ffeb3b;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🏠 Real Estate Commission Calculator</h1>

    <div class="input-group">
        <label>Property Sale Price ($)</label>
        <input type="number" id="price" placeholder="500000" value="500000">
    </div>

    <div class="input-group">
        <label>Commission Rate (%)</label>
        <input type="number" id="rate" placeholder="3" value="3" step="0.1">
    </div>

    <button onclick="calculate()">Calculate Commission</button>

    <div class="result" id="result" style="display:none;">
        Your Commission: $<span id="commission">0</span>
    </div>

    <div class="tagline">
        💡 Built by realtors, for realtors
    </div>

    <div class="cta">
        <strong>Track every lead automatically:</strong><br>
        <a href="https://grapevinecrm.com">Get Grapevine CRM - $99/year</a>
    </div>

    <script>
        function calculate() {
            const price = parseFloat(document.getElementById('price').value) || 0;
            const rate = parseFloat(document.getElementById('rate').value) || 0;
            const commission = (price * rate) / 100;

            document.getElementById('commission').textContent = commission.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            document.getElementById('result').style.display = 'block';
        }

        // Calculate on load
        calculate();
    </script>
</body>
</html>
